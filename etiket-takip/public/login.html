<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş · Etiket Takip</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script src="/assets/js/theme.js"></script>
</head>
<body>
  <div class="login-wrap">
    <section class="login-form">
      <form class="login-card stack" id="loginForm" novalidate>
        <div class="brandmark login-brand">
          <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6v12M8 6v12M11 6v12M15 6v12M17 6v12M20 6v12"/></svg></div>
          <b>Etiket Takip</b>
        </div>
        <div id="loginMsg"></div>
        <label class="f">Kullanıcı adı<input class="input" name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
        <label class="f">Şifre<input class="input" name="password" type="password" autocomplete="current-password" required></label>
        <label class="check"><input type="checkbox" name="remember"> Bu cihazda 30 gün oturum açık kalsın</label>
        <button class="btn primary lg" type="submit" id="loginBtn">Giriş yap</button>
      </form>
    </section>
  </div>
  <script type="module" src="/assets/js/login.js"></script>
</body>
</html>
