# Repo Netlify'a bağlandığında uygulama etiket-takip klasöründen derlenir.
# Ayrıntılı ayarlar: etiket-takip/netlify.toml
[build]
  base = "etiket-takip"
  publish = "public"
  command = "echo 'Derleme gerekmiyor'"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000"
    Cross-Origin-Opener-Policy = "same-origin"
    # Yalnızca kendi sunucumuzdan betik/stil/yazı tipi; dış sitelere veri gönderimi (connect-src) kapalı
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
